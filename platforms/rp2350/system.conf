# RP2350 system configuration -- baked into binary via string import
# Runs before user startup.conf
#
# Y23A-RP2350B: a WS2812 RGB LED on GP20.

/stream/serial add name=console device=uart1 baud-rate=115200
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/binding/gpio add name=status-led device=system component=panel.status kind=light gpio=20 drive=ws2812
