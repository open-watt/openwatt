# ESP32-S2 bring-up defaults
#
# What the chip does with nothing configured yet: offer a provisioning AP and
# enough services to upload a startup.conf. A startup.conf on the filesystem
# replaces this file; system.conf still applies underneath either way.
#
# Deliberately no station config: the site's network belongs in the uploaded
# startup.conf, not in a firmware image in a public repository.

/interface/ap add name=wap1 radio=wifi1 ssid="OpenWatt-ESP32-S2" auth=open
/protocol/ip/address/add address="192.168.1.1/24" interface=wap1
/protocol/ip/route/add destination="192.168.1.0/24" out-interface=wap1
/protocol/ip/pool/add name=ap_pool start=192.168.1.10 end=192.168.1.199
/protocol/dhcp/server/add name=ap interface=wap1 pool=ap_pool add-default-gateway=false

/protocol/telnet/server add name=console port=23

/protocol/http/server add name=webserver port=80
/apps/api add name=api http-server=webserver uri=/api
/sync/ws-server/add name=sync http-server=webserver uri=/sync
/apps/ota/add name=ota http-server=webserver uri=/ota
/protocol/http/fileserver/add name=files http-server=webserver uri=/files root="" access=write

/tools/pcap/server add name=rpcap port=2002 allow-anonymous=true
