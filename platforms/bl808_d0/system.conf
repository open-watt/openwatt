# BL808 system configuration — baked into binary via string import
# Runs before user startup.conf
#
# Sipeed M1s Dock: a WS2812 on GPIO8.

/stream/serial add name=console device=uart3 baud-rate=2000000
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/binding/gpio add name=status-led device=system component=panel.status kind=light gpio=8 drive=ws2812
