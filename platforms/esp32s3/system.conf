# ESP32-S3 platform definition -- baked into binary via string import
#
# What the chip *is*: consoles, buses, radios. This layer always applies, whether
# the unit is running its bring-up defaults or a startup.conf uploaded to the
# filesystem, so a deployment config never has to restate the hardware.
#
# Bring-up state (provisioning AP, servers) lives in default.conf.

/stream/usb-serial add name=console
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/system/update-rate rate=20
/system/log-level severity=trace

/interface/wifi add name=wifi1 channel=4

# CAN bus via TWAI peripheral (adjust GPIOs to match board wiring)
/interface/can add name=can0 device=twai0 baud-rate=500000 tx-gpio=4 rx-gpio=5
