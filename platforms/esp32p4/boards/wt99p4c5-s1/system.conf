# WT99P4C5-S1 platform definition
#
# What the board *is*: consoles, buses, pins, radios. This layer always applies,
# whether the board is running its bring-up defaults or a startup.conf uploaded
# to the filesystem, so a deployment config never has to restate the hardware.
#
# Bring-up state (servers) lives in default.conf.
#
# Hardware:
#   Console UART0: TX=GPIO37 RX=GPIO38, out the USB-C marked USB_UART via CP2102N
#   Ethernet:      IP101GRI at PHY address 1, MDC=GPIO31 MDIO=GPIO52 reset=GPIO51
#   ESP32-C5:      ESP-HOSTED SDIO, CMD=19 CLK=18 D0-D3=14-17 slave reset=54
#   I2C (ES8311):  SCL=GPIO8 SDA=GPIO7
#   SD (SDMMC):    CLK=43 CMD=44 D0-D3=39-42
#   RS485:         SIT3088EESA on the 2-pin terminal block
#
# Neither the Ethernet MAC nor the C5 has a driver yet, so this board has no network.

/stream/serial add name=console device=uart0 baud-rate=115200
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/system/update-rate rate=20
/system/log-level severity=trace
