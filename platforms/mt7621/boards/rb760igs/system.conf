# MikroTik hEX S platform definition
#
# What the board *is*. Bring-up state (servers) lives in default.conf.
#
# Hardware:
#   Console UART1: 115200 8N1, on pads under the heatsink; no header is fitted
#   Switch:        MT7530 behind GE1, ports 0-4 labelled ether1..ether5 (ether1 is PoE-in)
#   SFP:           sfp1 on GE2 through the SerDes PHY at MDIO 7; I2C module bus, present/LOS/TX-disable on GPIO8/6/10
#   Buttons:       reset GPIO18, mode GPIO13, both active low
#   LEDs:          power GPIO16, SFP GPIO9; the port LEDs are the MT7530's own
#   Buzzer:        GPIO15, needs PWM for a tone

/stream/serial add name=console device=uart1 baud-rate=115200
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/interface/ethernet add name=ether1 device=ge1 port=0
/interface/ethernet add name=ether2 device=ge1 port=1
/interface/ethernet add name=ether3 device=ge1 port=2
/interface/ethernet add name=ether4 device=ge1 port=3
/interface/ethernet add name=ether5 device=ge1 port=4

/interface/i2c add name=i2c1 device=i2c0 sda-gpio=3 scl-gpio=4
/interface/sfp add name=sfp1 device=ge2 phy-address=7 i2c=i2c1 mod-def0-gpio=8 los-gpio=6 tx-disable-gpio=10 led=system.panel.sfp

/binding/gpio add name=reset-button device=system component=panel.reset kind=button gpio=18 active=low hold=5s
/binding/gpio add name=mode-button device=system component=panel.mode kind=button gpio=13 active=low
/binding/gpio add name=power-led device=system component=panel.status kind=light gpio=16
/binding/gpio add name=sfp-led device=system component=panel.sfp kind=light gpio=9
