# MikroTik hEX S platform definition
#
# What the board *is*. Bring-up state (servers) lives in default.conf.
#
# Hardware:
#   Console UART1: 115200 8N1, on pads under the heatsink; no header is fitted
#   Switch:        MT7530 behind GE1, ports 0-4 labelled ether1..ether5 (ether1 is PoE-in)
#   SFP:           sfp1 on GE2 through the SerDes PHY at MDIO 7; I2C module bus, present/LOS/TX-disable on GPIO8/6/10
#   Buzzer:        GPIO15; power LED: GPIO16

/stream/serial add name=console device=uart1 baud-rate=115200
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"
