# MikroTik hEX S bring-up defaults
#
# What the router does with nothing configured yet. A startup.conf on the filesystem replaces
# this file; system.conf still applies underneath either way.
#
# ether1 is the WAN with a DHCP client; ether2..ether5 are bridged as the LAN on 192.168.4.1/24,
# the default LAN of every board, with a DHCP server.

/protocol/dhcp/client/add name=wan interface=ether1 add-default-route=true

/interface/bridge add name=lan
/interface/bridge/port/add bridge=lan interface=ether2
/interface/bridge/port/add bridge=lan interface=ether3
/interface/bridge/port/add bridge=lan interface=ether4
/interface/bridge/port/add bridge=lan interface=ether5
/protocol/ip/address/add address="192.168.4.1/24" interface=lan
/protocol/ip/pool/add name=lan start=192.168.4.10 end=192.168.4.199
/protocol/dhcp/server/add name=lan interface=lan pool=lan

/binding/sfp add name=sfp1 interface=sfp1 device=sfp1

/protocol/telnet/server add name=console port=23

/protocol/http/server add name=webserver port=80
/apps/api add name=api http-server=webserver uri=/api
/sync/ws-server/add name=sync http-server=webserver uri=/sync
/apps/ota/add name=ota http-server=webserver uri=/ota
