# ESP32-S31 defaults, replaced by a saved startup.conf.

/interface/ap add name=wap1 radio=wifi1 ssid="OpenWatt-ESP32-S31" auth=open
/protocol/ip/address/add address="192.168.4.1/24" interface=wap1
/protocol/ip/route/add destination="192.168.4.0/24" out-interface=wap1
/protocol/ip/pool/add name=ap_pool start=192.168.4.10 end=192.168.4.199
/protocol/dhcp/server/add name=ap interface=wap1 pool=ap_pool add-default-gateway=false

/protocol/dhcp/client/add name=eth1 interface=eth1 add-default-route=true

/protocol/telnet/server add name=console port=23

/protocol/http/server add name=webserver port=80
/apps/api add name=api http-server=webserver uri=/api
/sync/ws-server/add name=sync http-server=webserver uri=/sync
/apps/ota/add name=ota http-server=webserver uri=/ota
/protocol/http/fileserver/add name=files http-server=webserver uri=/files root="" access=write

/tools/pcap/server add name=rpcap port=2002 allow-anonymous=true

/sync/discover/udp/add name=discover interface=wap1
/sync/peering/set role=member
