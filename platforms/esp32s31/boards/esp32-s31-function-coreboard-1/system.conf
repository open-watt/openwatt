# ESP32-S31 hardware setup, applied before default.conf or startup.conf.

/stream/usb-serial add name=console
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/system/update-rate rate=20
/system/log-level severity=trace

/interface/wifi add name=wifi1
/interface/wpan add name=wpan1

# YT8531 on RGMII at the reference wiring of the part, PHY reset on GPIO7.
/interface/ethernet add name=eth1 phy=yt8531 phy-reset-gpio=7 hw-timestamp=true
