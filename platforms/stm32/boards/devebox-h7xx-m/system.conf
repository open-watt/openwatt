# DevEBox STM32H7XX_M platform definition
#
# Hardware:
#   USART1 PA9/PA10 on the headers (3.3 V TTL)
#   D1 is the hard-wired power LED; D2 PA1 (active low); K1 PE3, K2 PC5 (to GND, no pull-up); RST is NRST
#   QSPI W25Q64: NCS PB6, CLK PB2, IO0-3 PD11 PD12 PE2 PD13; SDMMC1 PC8-PC12, PD2

/stream/serial add name=console device=uart0 baud-rate=115200
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/binding/gpio add name=status-led device=system component=panel.status kind=light gpio=1 active=low drive=pwm
/binding/gpio add name=k1-button device=system component=panel.k1 kind=button gpio=67 active=low pull=up
/binding/gpio add name=k2-button device=system component=panel.k2 kind=button gpio=37 active=low pull=up
