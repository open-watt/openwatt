# JZ-F407VET6 platform definition
#
# Hardware:
#   USART1 PA9/PA10 through a MAX3232 to the DB9 (RS232 levels)
#   USART2 PD5/PD6, DE PD7: RS485 terminals
#   CAN1 PD0/PD1, CAN2 PB5/PB6; RMII Ethernet; LEDs PE13-PE15; SW1-SW3 PE10-PE12

/stream/serial add name=console device=uart0 baud-rate=115200
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"
