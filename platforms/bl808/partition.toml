[pt_table]
#partition table is 4K in size
address0 = 0xE000
address1 = 0xF000
# If version is 2, It will use dynamic mode.
version = 2

[[pt_entry]]
type = 16
name = "Boot2"
device = 0
address0 = 0
size0 = 0xE000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
# If header is 1, it will add the header.
header = 1

# Two banks; boot2 maps the active one at 0x58000000. Each holds the M0 image with the
# deflated D0 image appended.
[[pt_entry]]
type = 0
name = "FW"
device = 0
address0 = 0x10000
size0 = 0x400000
address1 = 0x410000
size1 = 0x400000
len = 0
header = 1

[[pt_entry]]
type = 4
name = "kv"
device = 0
address0 = 0x810000
size0 = 0x10000
address1 = 0
size1 = 0
len = 0
header = 0

[[pt_entry]]
type = 5
name = "media"
device = 0
address0 = 0x820000
size0 = 0x6E0000
address1 = 0
size1 = 0
len = 0
header = 0

# Written by the flash tool from the board dts; never written by the firmware.
[[pt_entry]]
type = 8
name = "factory"
device = 0
address0 = 0xF00000
size0 = 0x100000
address1 = 0
size1 = 0
len = 0
header = 0
