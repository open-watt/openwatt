# ESP32-H2 bring-up defaults
#
# What the chip does with nothing configured yet. A startup.conf on the filesystem
# replaces this file; system.conf still applies underneath either way.
#
# The part has no WiFi and no ethernet, so it has nothing to serve over IP: no
# provisioning AP, telnet, web, sync or OTA. The console in system.conf is the
# only route in.
