# SmartEVSE v3.0 platform definition
#
# What the board *is*: consoles, the EVSE hardware itself, radios. This layer
# always applies, whether the unit is running its bring-up defaults or a
# startup.conf uploaded to the filesystem.
#
# Bring-up state (provisioning AP, servers) lives in default.conf.
#
# The Module keeps the hardware offline until this ActiveObject claims it, then
# charging starts automatically on connection.

/stream/serial add name=console device=uart0 baud-rate=115200
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/system/update-rate rate=100

/driver/boards/smartevse/add name=evse current=60
/binding/smartevse/add name=evse evse=evse device=smartevse

# The energy-meter bus. The transceiver drives a shared active-high DE/RE from
# one pin, and v3.1 moves RX to GPIO37. What speaks on the bus is deployment
# configuration; the port itself is the board.
/stream/serial/add name=rs485 device=uart1 baud-rate=9600 tx-gpio=21 rx-gpio=23 de-gpio=22

/interface/wifi add name=wifi1
