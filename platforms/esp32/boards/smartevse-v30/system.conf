# SmartEVSE board-safe defaults. The Module keeps the hardware offline until
# this ActiveObject claims it, then charging starts automatically on connection.
/stream/serial add name=console device=uart0 baud-rate=115200
/console/session add name=default stream=console profile=vt100 initial-command="/log/print --stream"

/system/update-rate rate=100
/driver/boards/smartevse/add name=evse current=60
/binding/smartevse/add name=evse evse=evse device=smartevse

/interface/wifi add name=wifi1
/interface/ap add name=setup radio=wifi1 ssid="OpenWatt-SmartEVSE" auth=open
/protocol/ip/address/add address="192.168.4.1/24" interface=setup
/protocol/ip/route/add destination="192.168.4.0/24" out-interface=setup
/protocol/ip/pool/add name=setup start=192.168.4.10 end=192.168.4.50
/protocol/dhcp/server/add name=setup interface=setup pool=setup add-default-gateway=true

/protocol/http/server/add name=webserver port=80
/apps/api/add name=api http-server=webserver uri=/api
/sync/ws-server/add name=sync http-server=webserver uri=/sync
/apps/ota/add name=ota http-server=webserver uri=/ota commit-time=30s
