	reg: 0x405DD, u16, 0.01%			desc: thduA, %, high, "Total harmonic distortion of voltage on A phase"
	reg: 0x405DE, u16, 0.01%			desc: thduB, %, high, "Total harmonic distortion of voltage on B phase"
	reg: 0x405DF, u16, 0.01%			desc: thduC, %, high, "Total harmonic distortion of voltage on C phase"
	reg: 0x405E0, u16, 0.01%			desc: thdiA, %, high, "Total harmonic distortion of current on A phase"
	reg: 0x405E1, u16, 0.01%			desc: thdiB, %, high, "Total harmonic distortion of current on B phase"
	reg: 0x405E2, u16, 0.01%			desc: thdiC, %, high, "Total harmonic distortion of current on C phase"
#	reg: 0x405E3, u16[30], 0.01%		desc: thua, %, high, "Harmonic voltage on A phase 2nd-31st"
#	reg: 0x40601, u16[30], 0.01%		desc: thub, %, high, "Harmonic voltage on B phase 2nd-31st"
#	reg: 0x4061F, u16[30], 0.01%		desc: thuc, %, high, "Harmonic voltage on C phase 2nd-31st"
#	reg: 0x4063D, u16[30], 0.01%		desc: thia, %, high, "Harmonic current on A phase 2nd-31st"
#	reg: 0x4065B, u16[30], 0.01%		desc: thib, %, high, "Harmonic current on B phase 2nd-31st"
#	reg: 0x40679, u16[30], 0.01%		desc: thic, %, high, "Harmonic current on C phase 2nd-31st"
	reg: 0x40697, u16, 0.1V				desc: fundamentalVoltageA, V, high, "Fundamental voltage on A phase"
	reg: 0x40698, u16, 0.1V				desc: fundamentalVoltageB, V, high, "Fundamental voltage on B phase"
	reg: 0x40699, u16, 0.1V				desc: fundamentalVoltageC, V, high, "Fundamental voltage on C phase"
	reg: 0x4069A, u16, 0.1V				desc: harmonicVoltageA, V, high, "Harmonic voltage on A phase"
	reg: 0x4069B, u16, 0.1V				desc: harmonicVoltageB, V, high, "Harmonic voltage on B phase"
	reg: 0x4069C, u16, 0.1V				desc: harmonicVoltageC, V, high, "Harmonic voltage on C phase"
	reg: 0x4069D, u16, 0.01A			desc: fundamentalCurrentA, A, high, "Fundamental current on A phase"
	reg: 0x4069E, u16, 0.01A			desc: fundamentalCurrentB, A, high, "Fundamental current on B phase"
	reg: 0x4069F, u16, 0.01A			desc: fundamentalCurrentC, A, high, "Fundamental current on C phase"
	reg: 0x406A0, u16, 0.01A			desc: harmonicCurrentA, A, high, "Harmonic current on A phase"
	reg: 0x406A1, u16, 0.01A			desc: harmonicCurrentB, A, high, "Harmonic current on B phase"
	reg: 0x406A2, u16, 0.01A			desc: harmonicCurrentC, A, high, "Harmonic current on C phase"
	reg: 0x406A3, u16, W				desc: fundamentalActivePowerA, W, high, "Fundamental active power on A phase"
	reg: 0x406A4, u16, W				desc: fundamentalActivePowerB, W, high, "Fundamental active power on B phase"
	reg: 0x406A5, u16, W				desc: fundamentalActivePowerC, W, high, "Fundamental active power on C phase"
	reg: 0x406A6, u16, W				desc: totalFundamentalActivePower, W, high, "Total fundamental active power"
	reg: 0x406A7, u16, var				desc: fundamentalReactivePowerA, var, high, "Fundamental reactive power on A phase"
	reg: 0x406A8, u16, var				desc: fundamentalReactivePowerB, var, high, "Fundamental reactive power on B phase"
	reg: 0x406A9, u16, var				desc: fundamentalReactivePowerC, var, high, "Fundamental reactive power on C phase"
	reg: 0x406AA, u16, var				desc: totalFundamentalReactivePower, var, high, "Total fundamental reactive power"
	reg: 0x406AB, u16, W				desc: harmonicActivePowerA, W, high, "Harmonic active power on A phase"
	reg: 0x406AC, u16, W				desc: harmonicActivePowerB, W, high, "Harmonic active power on B phase"
	reg: 0x406AD, u16, W				desc: harmonicActivePowerC, W, high, "Harmonic active power on C phase"
	reg: 0x406AE, u16, W				desc: totalHarmonicActivePower, W, high, "Total harmonic active power"
	reg: 0x406AF, u16, var				desc: harmonicReactivePowerA, var, high, "Harmonic reactive power on A phase"
	reg: 0x406B0, u16, var				desc: harmonicReactivePowerB, var, high, "Harmonic reactive power on B phase"
	reg: 0x406B1, u16, var				desc: harmonicReactivePowerC, var, high, "Harmonic reactive power on C phase"
	reg: 0x406B2, u16, var				desc: totalHarmonicReactivePower, var, high, "Total harmonic reactive power"

