elements:
    aa55: 9, 32, u16:%, RW desc: on_grid_soc, %, high
        write: aa55, 0x0560
        range: 0%, 100%
    goodwe-register: 0x05A1, 0, u16:%, RW desc: off_grid_soc, %, high
        write: aa55, 0x05A1
        range: 0%, 100%
    goodwe-rtu: 0x055D, 0, u16:0.1A, RW desc: charge_current, A, high
        write: modbus, 0x055D
        range: 0A, 100A
    goodwe-rtu: 47547, 0, u8, RW desc: start_hour, , high
        write: modbus, 47547, 6, 0
    goodwe-rtu: 47547, 1, u8, RW desc: start_minute, , high
        write: modbus, 47547, 6, 1
    goodwe-rtu: 45400, 0, u16:0.1V desc: safety_voltage, V, high
        invalid: 0xFFFF

device-template:
    component:
        id: config
        element-map: on_grid_soc, @on_grid_soc
        element-map: off_grid_soc, @off_grid_soc
        element-map: charge_current, @charge_current
        element-map: safety_voltage, @safety_voltage
        component:
            id: tou
            element-map: start_hour, @start_hour
            element-map: start_minute, @start_minute
