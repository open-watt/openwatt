enum: WorkMode
    wait: 0
    on_grid: 1
    off_grid: 2

elements:
    aa55: 6, 16, u16:0.1V, RW, desc: battery_voltage, V, high
    aa55: 6, 52, enum8:WorkMode, RW, desc: work_mode, , high

device-template:
    component:
        id: battery
        component:
            id: meter
            element-map: voltage, @battery_voltage
    component:
        id: inverter
        element-map: mode, @work_mode
