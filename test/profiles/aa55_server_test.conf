elements:
    aa55: 2, 0, str5, RW, desc: firmware
    aa55: 2, 5, str10, RW, desc: model
    aa55: 2, 31, str16, RW, desc: serial
    aa55: 2, 47, str4, RW, desc: nominal
    aa55: 2, 51, str12, RW, desc: software
    aa55: 6, 34, u16:0.1V, RW, desc: voltage, V, high
    aa55: 6, 36, s16:W, RW, desc: power, W, high

    goodwe-module: 1, 0, str, RW desc: module_firmware
    goodwe-module: 3, 0, str, RW desc: module_mode
        field: csv, 0
    goodwe-module: 3, 0, str, RW desc: module_address
        field: csv, 1
    goodwe-module: 3, 0, str, RW desc: module_netmask
        field: csv, 2
    goodwe-module: 3, 0, str, RW desc: module_gateway
        field: csv, 3
    goodwe-module: 3, 0, str, RW desc: module_dns
        field: csv, 4

    goodwe-module: 4, 0, str, RW desc: module_server1
        request-byte: 1
        field: status, 0
    goodwe-module: 4, 0, str, RW desc: module_server2
        request-byte: 2
        field: status, 0
    goodwe-module: 5, 0, u8, RW desc: module_channel
        request-byte: 1
    goodwe-module: 5, 1, u16, RW desc: module_sent
        request-byte: 1
    goodwe-module: 5, 3, u16, RW desc: module_received
        request-byte: 1

    reg: 40010, u16, RW desc: holding_value, , high
    reg: 30010, u16, RW desc: input_value, , high

device-template:
    component:
        id: info
        element-map: firmware, @firmware
        element-map: model_id, @model
        element-map: serial_number, @serial
        element-map: nominal, @nominal
        element-map: software, @software
    component:
        id: grid
        template: EnergyMeter
        element: type, "single-phase"
        element-map: voltage, @voltage
        element-map: power, @power
    component:
        id: communication_module
        element-map: server1, @module_server1
        element-map: server2, @module_server2
        element-map: channel, @module_channel
        element-map: sent, @module_sent
        element-map: received, @module_received
        element-map: firmware, @module_firmware
        component:
            id: network
            element-map: mode, @module_mode
            element-map: address, @module_address
            element-map: netmask, @module_netmask
            element-map: gateway, @module_gateway
            element-map: dns, @module_dns
    component:
        id: registers
        element-map: holding, @holding_value
        element-map: input, @input_value
