name: CI Matrix

on:
  push:
    branches: [ "master", "release" ]
  pull_request:
    branches: [ "master", "release" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ startsWith(matrix.arch, 'arm') && 'ubuntu-24.04-arm' || format('{0}-latest', matrix.os == 'linux' && 'ubuntu' || matrix.os) }}  # GitHub-hosted runners
    strategy:
      matrix:
        os: [windows, linux]
        compiler: [dmd, ldc]
        arch: [x86, x86_64, arm, arm64, riscv64]
        exclude:
          # No point cross-compiling on Windows; linux is so much faster!
          - os: windows
            arch: arm
          - os: windows
            arch: arm64
          - os: windows
            arch: riscv64
          # TODO: DMD ARM64 support is WIP; remove when it releases...
          - compiler: dmd
            arch: arm64
          - compiler: dmd
            arch: arm
          - arch: arm # TODO: not yet working...
          - arch: riscv64 # TODO: not yet working...
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup D Compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler == 'dmd' && 'dmd-master' || matrix.compiler }}

      # Linux needs mbedtls for TLS/crypto support
      - name: Install mbedtls (Linux)
        if: ${{ matrix.os == 'linux' }}
        uses: ./.github/actions/apt-install
        with:
          key: mbedtls
          packages: libmbedtls-dev
      # 32-bit linux needs libs to link and run tests...
      - name: Install 32-bit Toolchains (Linux)
        if: ${{ matrix.os == 'linux' && matrix.arch == 'x86' }}
        uses: ./.github/actions/apt-install
        with:
          key: multilib-i386
          foreign-arch: i386
          packages: gcc-multilib libmbedtls-dev:i386
      - name: Install 32-bit ARM Toolchains (Linux)
        if: ${{ matrix.os == 'linux' && matrix.arch == 'arm' }}
        uses: ./.github/actions/apt-install
        with:
          key: libstdcxx-armhf
          foreign-arch: armhf
          packages: libstdc++6:armhf

      - name: Build release
        if: ${{ github.ref == 'refs/heads/release' }}
        run: make ARCH=${{ matrix.arch }} CONFIG=release OS=${{ matrix.os }} COMPILER=${{ matrix.compiler }}
      - name: Build unittest
        run: make ARCH=${{ matrix.arch }} CONFIG=unittest OS=${{ matrix.os }} COMPILER=${{ matrix.compiler }}

      - name: Test
        if: ${{ success() && (matrix.arch == 'x86_64' || matrix.arch == 'x86' || matrix.arch == 'arm64') }}
        run: ./bin/${{ matrix.arch }}_${{ matrix.os }}_unittest/openwatt_test

      - name: Upload release binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release' && matrix.compiler == 'ldc' }}
        uses: actions/upload-artifact@v4
        with:
          name: openwatt_${{ matrix.os }}_${{ matrix.arch }}
          path: ./bin/${{ matrix.arch }}_${{ matrix.os }}_release/openwatt

  baremetal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [bl808, bl808_m0, rp2350]  # stm4xx, stm7xx -- no linker script yet
        include:
          - platform: bl808
            toolchain: riscv64-unknown-elf
          # Also the coverage for bl618: platforms/bl618 is the shared E907 driver pool.
          - platform: bl808_m0
            toolchain: riscv64-unknown-elf
            make_args: PROCESSOR=e907
          - platform: rp2350
            toolchain: arm-none-eabi
          # - platform: stm4xx
          #   toolchain: arm-none-eabi
          # - platform: stm7xx
          #   toolchain: arm-none-eabi
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      # arm links newlib's libc.a through the gcc-arm-none-eabi-lib alternative, so newlib
      # is explicit here; its libstdc++-arm-none-eabi-newlib recommend (463MB) is not linked.
      - name: Install cross toolchain
        uses: ./.github/actions/apt-install
        with:
          key: ${{ matrix.toolchain }}
          packages: gcc-${{ matrix.toolchain }} picolibc-${{ matrix.toolchain }}${{ matrix.toolchain == 'arm-none-eabi' && ' libnewlib-arm-none-eabi' || '' }}

      - name: Build
        run: timeout 180 make PLATFORM=${{ matrix.platform }} CONFIG=release ${{ matrix.make_args || '' }}

  cross-esp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        target:
          # Where a board ships on the chip, build the board: one job covers the
          # platform and the deployed configuration.
          - { name: esp32,    arch: xtensa, board: smartevse-v30 }                # LX6
          - { name: esp32-s3, arch: xtensa, board: waveshare-esp32-s3-rs485-can }  # LX7
          - { name: esp32-c5, arch: riscv  }
          - { name: esp32-c6, arch: riscv  }
          - { name: esp32-p4, arch: riscv  }  # RV32IMAFDCV
      fail-fast: false
    env:
      # The IDF link is minutes per target, so only builds that ship binaries pay for it.
      BUILD_FIRMWARE: ${{ github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch' }}
      IDF_REF: v6.0
      IDF_TARGETS: esp32,esp32s3,esp32c5,esp32c6,esp32p4
      # A board selects its own platform; bare platforms build the devkit reference config.
      MAKE_TARGET: ${{ matrix.target.board && format('BOARD={0}', matrix.target.board) || format('PLATFORM={0}', matrix.target.name) }}
      BIN_DIR: bin/${{ matrix.target.name }}${{ matrix.target.board && format('_{0}', matrix.target.board) || '' }}_release
      ARTIFACT: firmware_${{ matrix.target.board || format('{0}_devkit', matrix.target.name) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Install RISC-V toolchain
        if: ${{ matrix.target.arch == 'riscv' }}
        uses: ./.github/actions/apt-install
        with:
          key: riscv64-unknown-elf
          packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: Build
        run: make $MAKE_TARGET CONFIG=unittest

      # One IDF install serves every target here, so all these jobs share a cache entry.
      - name: Setup ESP-IDF
        if: ${{ env.BUILD_FIRMWARE == 'true' }}
        uses: ./.github/actions/setup-esp-idf
        with:
          ref: ${{ env.IDF_REF }}
          targets: ${{ env.IDF_TARGETS }}
          clang: true

      # Embedded is release-only; a unittest image overflows flash.
      - name: Build firmware
        if: ${{ env.BUILD_FIRMWARE == 'true' }}
        run: make esp-idf-build $MAKE_TARGET CONFIG=release

      # A _devkit artifact carries the reference-board config; flashing one to a
      # deployed unit strands it. Board artifacts are the flashable ones.
      - name: Upload firmware
        if: ${{ env.BUILD_FIRMWARE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.BIN_DIR }}/openwatt.bin
            ${{ env.BIN_DIR }}/bootloader.bin
            ${{ env.BIN_DIR }}/partition-table.bin
            ${{ env.BIN_DIR }}/ota_data_initial.bin
