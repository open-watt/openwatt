name: CI Matrix

on:
  push:
    branches: [ "master", "release" ]
  pull_request:
    branches: [ "master", "release" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ startsWith(matrix.arch, 'arm') && 'ubuntu-24.04-arm' || format('{0}-latest', matrix.os == 'linux' && 'ubuntu' || matrix.os) }}  # GitHub-hosted runners
    strategy:
      matrix:
        os: [windows, linux]
        compiler: [dmd, ldc]
        arch: [x86, x86_64, arm, arm64, riscv64]
        exclude:
          # No point cross-compiling on Windows; linux is so much faster!
          - os: windows
            arch: arm
          - os: windows
            arch: arm64
          - os: windows
            arch: riscv64
          # TODO: DMD ARM64 support is WIP; remove when it releases...
          - compiler: dmd
            arch: arm64
          - compiler: dmd
            arch: arm
          - arch: arm # TODO: not yet working...
          - arch: riscv64 # TODO: not yet working...
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup D Compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler == 'dmd' && 'dmd-master' || matrix.compiler }}

      # Linux needs mbedtls for TLS/crypto support
      - name: Install mbedtls (Linux)
        if: ${{ matrix.os == 'linux' }}
        uses: ./.github/actions/apt-install
        with:
          key: mbedtls
          packages: libmbedtls-dev
      # 32-bit linux needs libs to link and run tests...
      - name: Install 32-bit Toolchains (Linux)
        if: ${{ matrix.os == 'linux' && matrix.arch == 'x86' }}
        uses: ./.github/actions/apt-install
        with:
          key: multilib-i386
          foreign-arch: i386
          packages: gcc-multilib libmbedtls-dev:i386
      - name: Install 32-bit ARM Toolchains (Linux)
        if: ${{ matrix.os == 'linux' && matrix.arch == 'arm' }}
        uses: ./.github/actions/apt-install
        with:
          key: libstdcxx-armhf
          foreign-arch: armhf
          packages: libstdc++6:armhf

      - name: Build release
        if: ${{ github.ref == 'refs/heads/release' }}
        run: make ARCH=${{ matrix.arch }} CONFIG=release OS=${{ matrix.os }} COMPILER=${{ matrix.compiler }}
      - name: Build unittest
        run: make ARCH=${{ matrix.arch }} CONFIG=unittest OS=${{ matrix.os }} COMPILER=${{ matrix.compiler }}

      - name: Test
        if: ${{ success() && (matrix.arch == 'x86_64' || matrix.arch == 'x86' || matrix.arch == 'arm64') }}
        run: ./bin/${{ matrix.arch }}_${{ matrix.os }}_unittest/openwatt_test

      - name: Upload release binary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release' && matrix.compiler == 'ldc' }}
        uses: actions/upload-artifact@v4
        with:
          name: openwatt_${{ matrix.os }}_${{ matrix.arch }}
          path: ./bin/${{ matrix.arch }}_${{ matrix.os }}_release/openwatt

  baremetal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [bl808, bl808_m0, bl618, rp2350]  # stm4xx, stm7xx -- no linker script yet
        include:
          - platform: bl808
            toolchain: riscv64-unknown-elf
          - platform: bl808_m0
            toolchain: riscv64-unknown-elf
            make_args: PROCESSOR=e907
          - platform: bl618
            toolchain: riscv64-unknown-elf
          - platform: rp2350
            toolchain: arm-none-eabi
          # - platform: stm4xx
          #   toolchain: arm-none-eabi
          # - platform: stm7xx
          #   toolchain: arm-none-eabi
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      # arm links newlib's libc.a through the gcc-arm-none-eabi-lib alternative, so newlib
      # is explicit here; its libstdc++-arm-none-eabi-newlib recommend (463MB) is not linked.
      - name: Install cross toolchain
        uses: ./.github/actions/apt-install
        with:
          key: ${{ matrix.toolchain }}
          packages: gcc-${{ matrix.toolchain }} picolibc-${{ matrix.toolchain }}${{ matrix.toolchain == 'arm-none-eabi' && ' libnewlib-arm-none-eabi' || '' }}

      - name: Build
        run: timeout 180 make PLATFORM=${{ matrix.platform }} CONFIG=release ${{ matrix.make_args || '' }}

  cross-esp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { name: esp32,    arch: xtensa }  # LX6
          - { name: esp32-s3, arch: xtensa }  # LX7
          - { name: esp32-p4, arch: riscv  }  # RV32IMAFDCV
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc

      - name: Install RISC-V toolchain
        if: matrix.target.arch == 'riscv'
        uses: ./.github/actions/apt-install
        with:
          key: riscv64-unknown-elf
          packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: Build
        run: make PLATFORM=${{ matrix.target.name }} CONFIG=unittest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwatt_test_${{ matrix.target.name }}
          path: bin/*/openwatt_test
